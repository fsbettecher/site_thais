<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thais Ohnesorge ARTE</title>
<meta name="description" content="O site de Thais Ohnesorge, ilustradora e aquarelista, está em construção. Em breve novidades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Beau+Rivage&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fffaf1;
    --sand:#f1ceb6;
    --green:#b4d75d;
    --wine:#923737;
    --red:#d24737;
    --ink:#2b2420;
    --ink-soft:#6b5f54;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:2rem;
    background:
      radial-gradient(circle at 15% 20%, var(--sand) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, var(--green) 0%, transparent 40%),
      var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    text-align:center;
  }
  .card{
    max-width:600px;
    width:100%;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    margin:0 auto;
  }
  .brand-mark img{
    width:200px;
    width:clamp(150px, 30vw, 200px);
    height:auto;
    flex:0 0 auto;
    margin-top:-6%;
    filter:drop-shadow(0 6px 14px rgba(146,55,55,0.12));
  }
  .brand-mark .script-name{
    font-family:'Beau Rivage', cursive;
    color:var(--wine);
    line-height:1;
    white-space:nowrap;
    flex:0 0 auto;
    font-size:2.6rem;
    font-size:clamp(1.9rem, 6vw, 2.6rem);
  }
  .brand-mark .name-left{
    text-align:right;
  }
  .brand-mark .name-right{
    text-align:left;
  }
  .status{
    margin-top:1.8rem;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.35rem;
    color:var(--ink-soft);
    letter-spacing:0.01em;
  }
  .lede{
    margin-top:0.6rem;
    font-size:0.98rem;
    color:var(--ink-soft);
  }
  .rule{
    width:64px;
    height:2px;
    background:var(--green);
    border:none;
    margin:1.6rem auto;
  }
  .social{
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .social a{
    color:var(--wine);
    text-decoration:none;
    border-bottom:1px solid var(--sand);
  }
  .social a:hover{
    border-color:var(--wine);
  }

  @media (max-width: 480px){
    .brand-mark{
      flex-wrap:wrap;
      row-gap:0.3rem;
    }
    .brand-mark img{
      order:-1;
      flex-basis:100%;
      margin-top:0;
      width:180px;
    }
    .brand-mark .script-name{
      font-size:2rem;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">
      <span class="script-name name-left">Thais</span>
      <img src="assets/img/hummingbird.png" alt="Beija-flor em aquarela, símbolo de Thais Ohnesorge Arte">
      <span class="script-name name-right">Ohnesorge</span>
    </div>

    <p class="status">Site em construção</p>
    <p class="lede">Em breve, novidades para você.</p>

    <hr class="rule">

    <p class="social">
      <a href="https://instagram.com/tha.ohne" target="_blank" rel="noopener">@tha.ohne</a>
      &nbsp;·&nbsp;
      <a href="mailto:ohnesorgethai@gmail.com">ohnesorgethai@gmail.com</a>
    </p>
  </div>
</body>
</html>
